name: Docker Hub (multi-arch)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag on Docker Hub (e.g. 1.28.0-trixie)"
        default: "1.28.0-trixie"
        type: string
      dockerfile:
        description: "Dockerfile path in the repo"
        default: "1.28.0-trixie.dockerfile"
        type: string
  push:
    tags:
      - "*"

permissions:
  contents: read
  actions: write # needed for cache-to: type=gha

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve Docker Hub image (user/repo)
        id: image
        run: |
          set -euo pipefail
          if [ -n "${IMAGE_VAR:-}" ]; then
            img="${IMAGE_VAR#docker.io/}"
          else
            if [ -z "${DOCKERHUB_USERNAME:-}" ]; then
              echo "::error::Set repository variable DOCKERHUB_IMAGE (e.g. myuser/nginx-brotli-static), or set secret DOCKERHUB_USERNAME for default myuser/<this-repo-name>."
              exit 1
            fi
            repo=$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')
            img="${DOCKERHUB_USERNAME}/${repo}"
          fi
          case "${img}" in
            *:*)
              echo "::error::Image name must not include a tag (use DOCKERHUB_IMAGE=user/repo only). Got: ${img}"
              exit 1
              ;;
            */*) ;;
            *)
              echo "::error::Invalid image name '${img}'. Expected user/repo."
              exit 1
              ;;
          esac
          echo "value=${img}" >> "${GITHUB_OUTPUT}"
        env:
          IMAGE_VAR: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Compute image tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          else
            echo "value=${IMAGE_TAG_INPUT}" >> "${GITHUB_OUTPUT}"
          fi
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile || '1.28.0-trixie.dockerfile' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.value }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
