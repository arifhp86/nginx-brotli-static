name: Docker Hub (multi-arch)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag on Docker Hub (e.g. 1.30.7-trixie)"
        default: "1.30.7-trixie"
        type: string
      dockerfile:
        description: "Dockerfile path in the repo (empty = <image_tag>.dockerfile)"
        default: ""
        type: string
  push:
    tags:
      - "*"

permissions:
  contents: read
  actions: write # needed for cache-to: type=gha

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve Docker Hub image (user/repo)
        id: image
        run: |
          set -euo pipefail
          if [ -n "${IMAGE_VAR:-}" ]; then
            img="${IMAGE_VAR#docker.io/}"
          else
            if [ -z "${DOCKERHUB_USERNAME:-}" ]; then
              echo "::error::Set repository variable DOCKERHUB_IMAGE (e.g. myuser/nginx-brotli-static), or set secret DOCKERHUB_USERNAME for default myuser/<this-repo-name>."
              exit 1
            fi
            repo=$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')
            img="${DOCKERHUB_USERNAME}/${repo}"
          fi
          case "${img}" in
            *:*)
              echo "::error::Image name must not include a tag (use DOCKERHUB_IMAGE=user/repo only). Got: ${img}"
              exit 1
              ;;
            */*) ;;
            *)
              echo "::error::Invalid image name '${img}'. Expected user/repo."
              exit 1
              ;;
          esac
          echo "value=${img}" >> "${GITHUB_OUTPUT}"
        env:
          IMAGE_VAR: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      # The Dockerfile always follows the tag (<tag>.dockerfile), so pushing git tag
      # 1.30.7-trixie builds 1.30.7-trixie.dockerfile. A missing file fails the run
      # instead of silently publishing a different nginx version under the new tag.
      - name: Compute image tag and Dockerfile
        id: tag
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            file="${tag}.dockerfile"
          else
            tag="${IMAGE_TAG_INPUT}"
            file="${DOCKERFILE_INPUT:-${tag}.dockerfile}"
          fi
          if [ ! -f "${file}" ]; then
            echo "::error::Dockerfile '${file}' not found for image tag '${tag}'."
            exit 1
          fi
          version=$(sed -n 's/^ARG NGINX_VERSION=//p' "${file}")
          case "${tag}" in
            "${version}"-*) ;;
            *)
              echo "::error::Tag '${tag}' does not start with NGINX_VERSION '${version}' from ${file}."
              exit 1
              ;;
          esac
          echo "value=${tag}" >> "${GITHUB_OUTPUT}"
          echo "dockerfile=${file}" >> "${GITHUB_OUTPUT}"
          echo "Building ${file} (nginx ${version}) as tag ${tag}"
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
          DOCKERFILE_INPUT: ${{ inputs.dockerfile }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.tag.outputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.value }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
